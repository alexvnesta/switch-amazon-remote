name: Experimental release
on:
  push:
    tags: ['v*-alpha.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make privacy-check host-test release-test
  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with pinned official SDK image and public libnx source
        env:
          RELEASE_IMAGE: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
          LIBNX_COMMIT: feebd026ca0f5dcc2119f46ad8e0d16ad3dd4973
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/src" --workdir /src \
            --env RELEASE_IMAGE --env LIBNX_COMMIT --env GITHUB_REF_TYPE --env GITHUB_REF_NAME \
            "$RELEASE_IMAGE" bash -euc '
              git config --global --add safe.directory /src
              git clone https://github.com/switchbrew/libnx.git /tmp/release-libnx
              git -C /tmp/release-libnx checkout "$LIBNX_COMMIT"
              make -C /tmp/release-libnx -j2
              make -C /tmp/release-libnx install
              export LIBNX_SOURCE_DIR=/tmp/release-libnx
              python3 scripts/package_release.py --toolchain-image "$RELEASE_IMAGE" --libnx-commit "$LIBNX_COMMIT"
              python3 scripts/verify_release.py dist --commit "$(git rev-parse HEAD)"
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experimental-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: experimental-release-assets
          path: dist
      - name: Validate downloaded assets and tag
        run: |
          python3 scripts/verify_release.py dist --commit "$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = "v$(tr -d '\n' < VERSION)"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - name: Publish alpha prerelease without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --latest=false \
            --title "$GITHUB_REF_NAME — experimental developer preview" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
